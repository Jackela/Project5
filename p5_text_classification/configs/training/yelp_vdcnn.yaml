# Training configuration for VDCNN on Yelp dataset
#
# This file ONLY contains parameters that are specific to the TRAINING process
# for this particular experiment (VDCNN on Yelp).

training:
  epochs: 15
  lr: 0.01
  expected_duration_hours: 15.0 # From paper's K40 estimate

  scheduler:
    type: "MultiStepLR"
    milestones_ratio: [0.5, 0.75]
    gamma: 0.1