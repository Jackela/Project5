[pytest]
# Specifies the minimum pytest version required.
minversion = 6.0

# Default command-line options.
# -ra: show extra test summary info for all but passed tests.
# -q: run in quiet mode.
addopts = -ra -q

# Specifies the directory where tests are located.
testpaths =
    p5_text_classification/tests

# Explicitly add the project root to the Python path.
# This ensures that absolute imports like 'from p5_text_classification.src...'
# work reliably, regardless of how pytest is invoked.
pythonpath = . 